<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width,initial-scale=1" name="viewport">
  <title>BMO Speech Engine</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body, html { width:100%; height:100%; overflow:hidden; background:#63bda4; cursor:default }
    #canvas { display:block; position:absolute; top:0; left:0; width:100vw; height:100vh; cursor:default!important; outline:none; }
    
    #loading {
      position:fixed; inset:0; background:#0f382a;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      z-index:999; font-family:Courier New,monospace; color:#d9ffea; gap:20px;
      transition:opacity .6s
    }
    #loading img {
      width:100px; filter:drop-shadow(0 0 20px rgba(100,189,164,.8));
      animation:bob 2s ease-in-out infinite
    }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    #loading-text { font-size:18px; letter-spacing:3px; color:#63bda4 }
    #progress-bar-wrap {
      width:260px; height:12px; background:#1e5c45;
      border-radius:6px; border:2px solid #2d8c60; overflow:hidden
    }
    #progress-bar {
      height:100%; width:0%; background:#63bda4; border-radius:4px;
      transition:width .3s; box-shadow:0 0 10px rgba(100,189,164,.8)
    }
    #fullscreen-btn {
      position:fixed; bottom:16px; right:16px; z-index:50;
      background:rgba(15,56,42,.7); color:#d9ffea;
      border:2px solid #2d8c60; border-radius:8px; padding:6px 12px;
      font-family:Courier New,monospace; font-size:12px; cursor:pointer;
      opacity:.4; transition:opacity .2s
    }
    #fullscreen-btn:hover { opacity:1 }
  </style>
</head>
<body>
  <div id="loading">
    <img alt="BMO" src="https://static.wikia.nocookie.net/adventuretimewithfinnandjake/images/8/81/BMO.png">
    <div id="loading-text">BOOTING SPEECH ENGINE...</div>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <button id="fullscreen-btn" onclick="goFullscreen()">⛶ FULLSCREEN</button>

  <script>
    // Force Device Pixel Ratio to 1 so the mouse grid and rendering grid never desync
    Object.defineProperty(window, 'devicePixelRatio', { get: function() { return 1; } });

    function goFullscreen() {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }

    var Module = {
      canvas: document.getElementById("canvas"),
      
      onRuntimeInitialized: function () {
        // The ResizeObserver fix that worked for the Face Engine
        var syncCanvas = function() {
          if (Module.setCanvasSize) {
            Module.setCanvasSize(window.innerWidth, window.innerHeight);
          }
        };

        syncCanvas();

        var observer = new ResizeObserver(syncCanvas);
        observer.observe(document.body);
      },
      
      print: function(e) { console.log(e); },
      printErr: function(e) { console.error(e); },
      setStatus: function(e) {
        if (!e) {
          var t = document.getElementById("loading");
          t.style.opacity = "0";
          setTimeout(function() { t.style.display = "none"; }, 600);
          return;
        }
        document.getElementById("loading-text").textContent = e.toUpperCase();
        var n = e.match(/(\d+)\/(\d+)/);
        if (n) {
          document.getElementById("progress-bar").style.width = (parseInt(n[1]) / parseInt(n[2]) * 100) + "%";
        }
      },
      monitorRunDependencies: function(e) {
        if (e === 0) Module.setStatus("");
      }
    };
  </script>
  <script async src="BMO_Speech.js"></script>
</body>
</html>
